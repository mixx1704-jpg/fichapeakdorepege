o ataque. Por 4 RC, um fragmento faz o único ataque adicional do turno com metade dos Passos de Dano e -1 acerto.","category":"Biológico • Enxame"},{"id":"corpo-desacoplado","section":"05. Anatomia e tamanho","name":"Corpo Desacoplado","grade":10,"cb":12,"ck":6,"cm":2,"effect":"Separe uma porção com metade da Dureza para explorar ou cumprir uma tarefa simples. Ela usa sua Ação para agir e não concede ações extras.","category":"Biológico • Construto"},{"id":"simetria-quimerica","section":"05. Anatomia e tamanho","name":"Simetria Quimérica","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Exige Quimera. Um ataque pode carregar propriedades mecânicas de dois tipos possuídos. Bônus equivalentes usam apenas o maior e não geram segundo ataque.","category":"Quimera • Convergência"},{"id":"morfologia-alternativa-i","section":"06. Metamorfose e mobilidade","name":"Morfologia Alternativa I","grade":6,"cb":6,"ck":3,"cm":0,"effect":"Anote dois Perfis. Com a Kakuja ativa, troque entre eles com uma Ação e 4 RC. A troca não é nova ativação.","category":"Metamorfose"},{"id":"morfologia-alternativa-ii","section":"06. Metamorfose e mobilidade","name":"Morfologia Alternativa II","grade":8,"cb":8,"ck":4,"cm":0,"effect":"Exige o nível I. Anote três Perfis; a troca passa a custar uma Ação e 3 RC.","category":"Metamorfose","requires":["morfologia-alternativa-i"]},{"id":"mudanca-relampago","section":"06. Metamorfose e mobilidade","name":"Mudança Relâmpago","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Uma vez por turno, troque de Perfil sem Ação pagando +3 RC. Não concede ataque ou defesa adicional.","category":"Metamorfose","requires":["morfologia-alternativa-i"]},{"id":"instinto-adaptativo","section":"06. Metamorfose e mobilidade","name":"Instinto Adaptativo","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por cena, após sofrer dano, substitua imediatamente até 2 CM do Perfil por módulos comprados. A troca dura até o fim da cena.","category":"Metamorfose • Reação"},{"id":"forma-reativa","section":"06. Metamorfose e mobilidade","name":"Forma Reativa","grade":10,"cb":12,"ck":6,"cm":2,"effect":"Uma vez por rodada, depois de sofrer dano, pague 4 RC para substituir 1 módulo de até 2 CM até o início do próximo turno.","category":"Metamorfose • Reação"},{"id":"reconfiguracao-perfeita","section":"06. Metamorfose e mobilidade","name":"Reconfiguração Perfeita","grade":12,"cb":20,"ck":10,"cm":2,"effect":"No início do turno, pague 3 RC para redistribuir até 3 CM entre módulos comprados, sem Ação. Uma vez por turno.","category":"Metamorfose"},{"id":"manifestacao-instantanea","section":"06. Metamorfose e mobilidade","name":"Manifestação Instantânea","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Ative a Kakuja sem gastar Reação, pagando +2 RC. Isso não permite ativá-la depois de saber o resultado de um ataque que já acertou.","category":"Ativação"},{"id":"locomocao-quadrupede","section":"06. Metamorfose e mobilidade","name":"Locomoção Quadrúpede","grade":6,"cb":4,"ck":2,"cm":1,"effect":"Ao gastar Movimento e não estar agarrado, percorra +1 espaço. Perde o bônus se realizar disparo pesado no mesmo turno.","category":"Mobilidade"},{"id":"escalada-predatoria","section":"06. Metamorfose e mobilidade","name":"Escalada Predatória","grade":6,"cb":4,"ck":2,"cm":1,"effect":"Mova-se por paredes e tetos no Deslocamento normal sem teste em superfícies capazes de suportá-lo.","category":"Mobilidade"},{"id":"salto-balistico","section":"06. Metamorfose e mobilidade","name":"Salto Balístico","grade":6,"cb":4,"ck":2,"cm":1,"effect":"Ignore obstáculos e desníveis comuns durante Movimento. Uma Investida iniciada por salto não sofre penalidade por terreno.","category":"Mobilidade"},{"id":"planagem-de-carapaca","section":"06. Metamorfose e mobilidade","name":"Planagem de Carapaça","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Atravesse espaços aéreos durante o Movimento, mas termine apoiado. Quedas comuns não causam dano.","category":"Mobilidade"},{"id":"asas-verdadeiras","section":"06. Metamorfose e mobilidade","name":"Asas Verdadeiras","grade":6,"cb":10,"ck":5,"cm":2,"effect":"Voo verdadeiro com deslocamento igual ao terrestre. Manobras comuns dispensam teste; situações extremas ainda usam Agilidade.","category":"Biológico • Voo"},{"id":"propulsao-de-rc","section":"06. Metamorfose e mobilidade","name":"Propulsão de RC","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por turno, depois de atacar, mova 1 espaço. O deslocamento não ativa Propulsão novamente.","category":"Mobilidade"},{"id":"arranque-elastico","section":"06. Metamorfose e mobilidade","name":"Arranque Elástico","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Gaste 3 RC para mover 1 espaço imediatamente antes ou depois de um ataque, sem provocar ataque de oportunidade. Uma vez por turno.","category":"Mobilidade"},{"id":"escavacao-viva","section":"06. Metamorfose e mobilidade","name":"Escavação Viva","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Mova-se por solo, concreto quebrado ou material semelhante à metade do Deslocamento. Enquanto enterrado, não ataque nem termine o turno dentro de estrutura maciça.","category":"Mobilidade"},{"id":"adaptacao-aquatica","section":"06. Metamorfose e mobilidade","name":"Adaptação Aquática","grade":6,"cb":4,"ck":2,"cm":1,"effect":"Respire e mova-se na água sem penalidade. Receba +2 dados contra correntes e pressão submersa.","category":"Biológico • Mobilidade"},{"id":"passo-impossivel","section":"06. Metamorfose e mobilidade","name":"Passo Impossível","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Uma vez por rodada, gaste 6 RC para reposicionar-se até 2 espaços ignorando criaturas, terreno difícil e oportunidades, mas não paredes ou barreiras fechadas.","category":"Mobilidade • Explosão"},{"id":"marcha-irrefreavel","section":"06. Metamorfose e mobilidade","name":"Marcha Irrefreável","grade":10,"cb":12,"ck":6,"cm":2,"effect":"Ignore terreno difícil e receba +2 dados contra empurrão, queda ou imobilização. Se vencer, avance 1 espaço em direção à fonte, uma vez por rodada.","category":"Mobilidade"},{"id":"potencia-predatoria-i","section":"07. Potência e técnicas ofensivas","name":"Potência Predatória I","grade":6,"cb":4,"ck":2,"cm":1,"effect":"+1 Passo de Dano em ataques da Kakuja.","category":"Ofensivo • Passivo"},{"id":"potencia-predatoria-ii","section":"07. Potência e técnicas ofensivas","name":"Potência Predatória II","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Exige I. +1 Passo adicional.","category":"Ofensivo • Passivo","requires":["potencia-predatoria-i"]},{"id":"potencia-predatoria-iii","section":"07. Potência e técnicas ofensivas","name":"Potência Predatória III","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Exige II. +1 Passo adicional.","category":"Ofensivo • Passivo","requires":["potencia-predatoria-ii"]},{"id":"potencia-predatoria-iv","section":"07. Potência e técnicas ofensivas","name":"Potência Predatória IV","grade":10,"cb":10,"ck":5,"cm":1,"effect":"Exige III. +1 Passo adicional.","category":"Ofensivo • Passivo","requires":["potencia-predatoria-iii"]},{"id":"potencia-predatoria-v","section":"07. Potência e técnicas ofensivas","name":"Potência Predatória V","grade":12,"cb":12,"ck":6,"cm":1,"effect":"Exige IV. +1 Passo adicional.","category":"Ofensivo • Passivo","requires":["potencia-predatoria-iv"]},{"id":"potencia-predatoria-vi","section":"07. Potência e técnicas ofensivas","name":"Potência Predatória VI","grade":14,"cb":14,"ck":7,"cm":1,"effect":"Exige V. +1 Passo adicional.","category":"Ofensivo • Passivo","requires":["potencia-predatoria-v"]},{"id":"massa-de-impacto","section":"07. Potência e técnicas ofensivas","name":"Massa de Impacto","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+2 Passos de Dano nos ataques corpo a corpo da Kakuja.","category":"Ofensivo • Passivo"},{"id":"mira-organica","section":"07. Potência e técnicas ofensivas","name":"Mira Orgânica","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+1 Modificador de Acerto em ataques da Kakuja. Não supera +2 vindo de módulos de Kakuja.","category":"Ofensivo • Precisão"},{"id":"arsenal-organico","section":"07. Potência e técnicas ofensivas","name":"Arsenal Orgânico","grade":6,"cb":8,"ck":4,"cm":1,"effect":"No início do turno escolha: Lâmina (+1 Passo), Martelo (+3 Passos de Dano e -1 acerto), Lança (+1 acerto e +1 alcance), Chicote (segundo alvo com metade dos Passos de Dano e -2 Passos) ou Escudo (+2 RD).","category":"Estrutural • Postura"},{"id":"arsenal-vivo-superior","section":"07. Potência e técnicas ofensivas","name":"Arsenal Vivo Superior","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Exige Arsenal Orgânico. Mantenha duas formas, mas bônus equivalentes não somam. Troque uma delas no início do turno.","category":"Estrutural • Postura","requires":["arsenal-organico"]},{"id":"gume-perfurante","section":"07. Potência e técnicas ofensivas","name":"Gume Perfurante","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por turno, gaste 4 RC antes do ataque para ignorar 2 RD. No Grau 10+, pode pagar 7 RC para ignorar metade da RD.","category":"Ofensivo • Explosão"},{"id":"ruptura-organica","section":"07. Potência e técnicas ofensivas","name":"Ruptura Orgânica","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Declare antes do ataque e remova 2 Passos de Dano. Se causar dano, reduza a RD do alvo em 2 contra o próximo ataque que ele receber.","category":"Ofensivo • Controle"},{"id":"golpe-de-cerco","section":"07. Técnicas ofensivas - continuação","name":"Golpe de Cerco","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+2 Passos contra objetos, barreiras, cobertura ou criaturas duas categorias maiores. Não vale contra alvos comuns.","category":"Ofensivo • Condicional"},{"id":"varredura-monstruosa","section":"07. Técnicas ofensivas - continuação","name":"Varredura Monstruosa","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Gaste 4 RC e ataque até dois alvos adjacentes com um teste. O dano sofre -2 Passos e efeitos de ao acertar são escolhidos para apenas um alvo.","category":"Ofensivo • Área"},{"id":"tremor-de-carne","section":"07. Técnicas ofensivas - continuação","name":"Tremor de Carne","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Gaste 6 RC e faça um ataque em área de 1 espaço ao redor. Alvos defendem separadamente; um único dano com -2 Passos é usado para todos.","category":"Ofensivo • Área"},{"id":"barragem-de-membros","section":"07. Técnicas ofensivas - continuação","name":"Barragem de Membros","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Gaste 5 RC depois de um ataque normal para gerar o único ataque adicional do turno, com metade dos Passos de Dano e sem efeitos de ao acertar.","category":"Ofensivo • Ataque adicional"},{"id":"retaliacao-bestial","section":"07. Técnicas ofensivas - continuação","name":"Retaliação Bestial","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Após Bloquear ou Esquivar completamente um ataque corpo a corpo, gaste 5 RC para fazer o único ataque adicional do turno contra o agressor, com metade dos Passos de Dano.","category":"Ofensivo • Reação"},{"id":"condensacao-muscular","section":"07. Técnicas ofensivas - continuação","name":"Condensação Muscular","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Sacrifique um ataque normal ainda disponível. Adicione metade dos Passos de Dano básicos dele a um único ataque. Custos, crítico e gatilhos são resolvidos uma vez.","category":"Ofensivo • Condensação"},{"id":"golpe-colossal","section":"07. Técnicas ofensivas - continuação","name":"Golpe Colossal","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Gaste 8 RC: +4 Passos no próximo ataque. Depois, -2 dados de defesa até seu próximo turno. Uma vez por turno.","category":"Ofensivo • Explosão"},{"id":"cacada-crescente","section":"07. Técnicas ofensivas - continuação","name":"Caçada Crescente","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Ataques consecutivos no mesmo alvo acumulam +1 Passo de Dano, máximo +3. Errar ou trocar de alvo remove tudo; máximo 2 acúmulos por turno.","category":"Ofensivo • Ritmo"},{"id":"execucao-predatoria","section":"07. Técnicas ofensivas - continuação","name":"Execução Predatória","grade":10,"cb":12,"ck":6,"cm":1,"effect":"Contra alvo com 1/4 ou menos da Vida, o primeiro ataque do turno recebe +4 Passos de Dano. Não ativa contra figurantes irrelevantes criados para alimentar o efeito.","category":"Ofensivo • Execução"},{"id":"impacto-carniceiro","section":"07. Técnicas ofensivas - continuação","name":"Impacto Carniceiro","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Se superar a defesa por 2 acertos, gaste 6 RC e escolha: +3 Passos, ignorar metade da RD ou impedir a Reação do alvo até o próximo turno. Uma vez por turno.","category":"Ofensivo • Explosão"},{"id":"critico-deformador","section":"07. Técnicas ofensivas - continuação","name":"Crítico Deformador","grade":10,"cb":12,"ck":6,"cm":1,"effect":"Em crítico, escolha empurrar 1 espaço, quebrar 2 RD até o próximo turno ou impor -2 dados na próxima defesa. Não acrescenta outro multiplicador de dano.","category":"Ofensivo • Crítico"},{"id":"predacao-de-rc","section":"07. Técnicas ofensivas - continuação","name":"Predação de RC","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Ao causar dano, gaste 5 RC. O alvo testa Vigor contra sua MD; em falha perde 2 RC e você recupera 1. Uma vez por turno; não funciona em alvo sem RC.","category":"Biológico • Dreno"},{"id":"couraca-kakuja-i","section":"08. Defesa, couraça e proteção","name":"Couraça Kakuja I","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+2 RD proveniente da Kakuja.","category":"Defensivo • Passivo"},{"id":"couraca-kakuja-ii","section":"08. Defesa, couraça e proteção","name":"Couraça Kakuja II","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Exige I. +2 RD adicional.","category":"Defensivo • Passivo","requires":["couraca-kakuja-i"]},{"id":"couraca-kakuja-iii","section":"08. Defesa, couraça e proteção","name":"Couraça Kakuja III","grade":10,"cb":10,"ck":5,"cm":1,"effect":"Exige II. +2 RD adicional.","category":"Defensivo • Passivo","requires":["couraca-kakuja-ii"]},{"id":"couraca-kakuja-iv","section":"08. Defesa, couraça e proteção","name":"Couraça Kakuja IV","grade":12,"cb":12,"ck":6,"cm":1,"effect":"Exige III. +2 RD adicional.","category":"Defensivo • Passivo","requires":["couraca-kakuja-iii"]},{"id":"tecido-reforcado-i","section":"08. Defesa, couraça e proteção","name":"Tecido Reforçado I","grade":6,"cb":4,"ck":2,"cm":1,"effect":"+6 Dureza da Kakuja; não concede RD ao usuário.","category":"Defensivo • Dureza"},{"id":"tecido-reforcado-ii","section":"08. Defesa, couraça e proteção","name":"Tecido Reforçado II","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Exige I. +6 Dureza adicional.","category":"Defensivo • Dureza","requires":["tecido-reforcado-i"]},{"id":"escudo-instintivo","section":"08. Defesa, couraça e proteção","name":"Escudo Instintivo","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Como Reação, gaste 2 RC para reduzir o dano em metade do Grau depois da RD.","category":"Defensivo • Reação"},{"id":"absorcao-de-impacto","section":"08. Defesa, couraça e proteção","name":"Absorção de Impacto","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por rodada, depois da RD, gaste 3 RC para reduzir o dano restante em metade do Grau.","category":"Defensivo • Reação"},{"id":"pressao-defensiva","section":"08. Defesa, couraça e proteção","name":"Pressão Defensiva","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Uma vez por rodada, depois da RD, gaste 6 RC para dividir o dano restante por 2. Não combina com outra divisão ou anulação.","category":"Defensivo • Reação"},{"id":"armadura-adaptativa","section":"08. Defesa, couraça e proteção","name":"Armadura Adaptativa","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Depois de sofrer um tipo de dano, receba +2 RD contra a mesma fonte ou propriedade até o próximo turno. Máximo um tipo adaptado.","category":"Defensivo • Adaptação"},{"id":"fortaleza-imovel","section":"08. Defesa, couraça e proteção","name":"Fortaleza Imóvel","grade":8,"cb":10,"ck":5,"cm":1,"effect":"A cada turno inteiro sem mover-se, ganhe +2 RD, máximo +4. Mover mais da metade do Deslocamento remove o bônus.","category":"Defensivo • Postura"},{"id":"ancora-organica","section":"08. Defesa, couraça e proteção","name":"Âncora Orgânica","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+2 dados contra empurrar, derrubar ou arrastar. Em sucesso total, ignore o deslocamento forçado.","category":"Defensivo • Controle"},{"id":"muralha-para-os-seus","section":"08. Defesa, couraça e proteção","name":"Muralha para os Seus","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Como Reação, mova até 1 espaço e torne-se alvo de um ataque contra aliado. Receba +2 RD somente contra esse ataque.","category":"Defensivo • Proteção"},{"id":"espinhos-de-retaliacao","section":"08. Defesa, couraça e proteção","name":"Espinhos de Retaliação","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Uma vez por turno, ao zerar dano corpo a corpo com RD/Bloqueio, cause metade dos Passos de Dano básicos da Kakuja ao agressor. Não crita nem ativa efeitos.","category":"Defensivo • Retaliação"},{"id":"armazenar-impacto","section":"08. Defesa, couraça e proteção","name":"Armazenar Impacto","grade":10,"cb":12,"ck":6,"cm":2,"effect":"Ao reduzir dano, armazene até metade do Grau como Carga. No próximo ataque, consuma tudo como Passos de Dano. Uma carga por vez.","category":"Defensivo • Conversão"},{"id":"absorvedor-de-rc","section":"08. Defesa, couraça e proteção","name":"Absorvedor de RC","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Uma vez por turno, se sua RD zerar o dano de uma habilidade de Kagune, recupere 2 RC. Máximo 4 RC por turno e nunca acima do máximo.","category":"Defensivo • RC"},{"id":"casulo-de-emergencia","section":"08. Defesa, couraça e proteção","name":"Casulo de Emergência","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Uma vez por cena, como Reação, torne-se incapaz de atacar e mover até o próximo turno; receba +6 RD e imunidade a deslocamento forçado.","category":"Defensivo • Sobrevivência"},{"id":"barreira-elemental","section":"08. Defesa, couraça e proteção","name":"Barreira Elemental","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Escolha uma propriedade elemental comprada. +3 RD contra ela e +1 dado no primeiro teste por cena para resistir ao efeito associado.","category":"Defensivo • Elemental","requires":["infusao-elemental"]},{"id":"vesicula-de-rc-i","section":"09. Biologia, reserva e regeneração","name":"Vesícula de RC I","grade":6,"cb":8,"ck":4,"cm":0,"effect":"Crie uma Reserva Kakuja de 4 RC, separada do RC normal e utilizável apenas com a Kakuja ativa. Recupera metade no Descanso Longo e pelo dobro da Fome removida ao alimentar-se.","category":"Biológico • Reserva"},{"id":"vesicula-de-rc-ii","section":"09. Biologia, reserva e regeneração","name":"Vesícula de RC II","grade":8,"cb":10,"ck":5,"cm":0,"effect":"Exige I. A Reserva aumenta em +4 RC.","category":"Biológico • Reserva","requires":["vesicula-de-rc-i"]},{"id":"vesicula-de-rc-iii","section":"09. Biologia, reserva e regeneração","name":"Vesícula de RC III","grade":10,"cb":12,"ck":6,"cm":0,"effect":"Exige II. A Reserva aumenta em +4 RC.","category":"Biológico • Reserva","requires":["vesicula-de-rc-ii"]},{"id":"metabolismo-eficiente","section":"09. Biologia, reserva e regeneração","name":"Metabolismo Eficiente","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Reduza em 2 RC o custo da primeira ativação de Kakuja após Descanso Longo, mínimo 2. Não reduz manutenção.","category":"Biológico • Eficiência"},{"id":"cicatrizacao-de-combate-i","section":"09. Biologia, reserva e regeneração","name":"Cicatrização de Combate I","grade":6,"cb":8,"ck":4,"cm":1,"effect":"No início do turno, cure 2 Vida. Ao curar ao todo sua Vida Máxima, pague 2 RC ou receba +1 Fome se não puder.","category":"Biológico • Regeneração"},{"id":"cicatrizacao-de-combate-ii","section":"09. Biologia, reserva e regeneração","name":"Cicatrização de Combate II","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Exige I. A cura passa a 4 Vida por turno. Não soma com Regeneração Anormal; use a maior.","category":"Biológico • Regeneração","requires":["cicatrizacao-de-combate-i"]},{"id":"reconstrucao-de-membros","section":"09. Biologia, reserva e regeneração","name":"Reconstrução de Membros","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Uma vez por turno, gaste 6 RC para regenerar todos os membros comuns perdidos. Não recupera Vida por si só.","category":"Biológico • Regeneração"},{"id":"purga-celular","section":"09. Biologia, reserva e regeneração","name":"Purga Celular","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Uma vez por cena, gaste 8 RC e uma Ação para encerrar uma condição física, veneno ou elemento biológico que permita resistência. Não remove Mácula nem Fome.","category":"Biológico • Cura"},{"id":"casulo-regenerativo","section":"09. Biologia, reserva e regeneração","name":"Casulo Regenerativo","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Gaste uma Ação e 5 RC. Até seu próximo turno não ataque nem mova; a primeira cura biológica recebida aumenta em 50%. Multiplicadores não se somam.","category":"Biológico • Regeneração"},{"id":"conversao-hematica","section":"09. Biologia, reserva e regeneração","name":"Conversão Hemática","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por turno, perca até 6 Vida para recuperar 1 RC a cada 3 Vida. Essa perda ignora RD e não ativa efeitos de sofrer dano.","category":"Biológico • Conversão"},{"id":"mordida-drenante","section":"09. Biologia, reserva e regeneração","name":"Mordida Drenante","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Ao causar dano em alvo agarrado, gaste 4 RC para recuperar Vida igual à metade do Grau. Uma vez por turno.","category":"Biológico • Dreno"},{"id":"sacrificio-de-apendice","section":"09. Biologia, reserva e regeneração","name":"Sacrifício de Apêndice","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Destrua uma parte funcional da Kakuja para recuperar 5% da Vida Máxima +2 RC. Uma vez por turno; a parte não retorna por 2 turnos.","category":"Biológico • Sacrifício"},{"id":"orgao-redundante","section":"09. Biologia, reserva e regeneração","name":"Órgão Redundante","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Uma vez por cena, ao sofrer uma condição física que o incapacitaria, ignore-a até o fim do próximo turno. O dano permanece.","category":"Biológico • Sobrevivência"},{"id":"falso-nucleo","section":"09. Biologia, reserva e regeneração","name":"Falso Núcleo","grade":10,"cb":12,"ck":6,"cm":1,"effect":"Crie uma isca. A primeira tentativa de atingir seu Kakuhou na cena recebe -2 dados adicionais; em falha, o agressor acredita ter localizado o núcleo.","category":"Biológico • Engano"},{"id":"semente-de-carne","section":"09. Biologia, reserva e regeneração","name":"Semente de Carne","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Gaste 8 RC e uma Ação para criar um organismo simples com Dureza igual ao Grau. Ele cumpre uma ordem e usa sua Ação para agir; não possui Kakuja ou Vantagens.","category":"Biológico • Construto"},{"id":"recusa-da-morte","section":"09. Biologia, reserva e regeneração","name":"Recusa da Morte","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Uma vez por sessão, ao cair a 0 Vida, gaste 15 RC para permanecer com 1. Não funciona com cérebro destruído, RC 0 ou outro efeito de prevenção de morte na mesma cena.","category":"Biológico • Sobrevivência"},{"id":"infusao-elemental","section":"10. Núcleos elementais","name":"Infusão Elemental","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Escolha uma propriedade. Ativar custa 2 RC e manter custa 1 RC por turno. Uma vez por turno, um ataque recebe +3 dano e aplica o Condutor básico se causar dano.","category":"Elemental • Núcleo"},{"id":"potencia-elemental","section":"10. Núcleos elementais","name":"Potência Elemental","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Exige Infusão. O bônus sobe para +6 dano e libera o Condutor elevado. O teto de dano fixo da Kakuja continua valendo.","category":"Elemental • Núcleo","requires":["infusao-elemental"]},{"id":"nucleo-duplo","section":"10. Núcleos elementais","name":"Núcleo Duplo","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Compre uma segunda propriedade. Escolha qual está ativa no início do turno; elas não funcionam juntas.","category":"Elemental • Núcleo","requires":["infusao-elemental"]},{"id":"reacao-hibrida","section":"10. Núcleos elementais","name":"Reação Híbrida","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Exige Núcleo Duplo. Uma vez por turno, gaste 4 RC para aplicar dois Condutores no mesmo ataque. O dano elemental não duplica.","category":"Elemental • Convergência","requires":["nucleo-duplo"]},{"id":"nucleo-trino","section":"10. Núcleos elementais","name":"Núcleo Trino","grade":12,"cb":18,"ck":9,"cm":2,"effect":"Exige Núcleo Duplo. Compre terceira propriedade e troque a ativa sem Ação uma vez por turno. Ainda apenas uma fica ativa.","category":"Elemental • Núcleo","requires":["nucleo-duplo"]},{"id":"projetil-elemental","section":"11. Técnicas elementais","name":"Projétil Elemental","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Ataque elemental alcança +1 espaço além do alcance normal. Gaste 2 RC por disparo.","category":"Elemental • Distância","requires":["infusao-elemental"]},{"id":"manto-elemental","section":"11. Técnicas elementais","name":"Manto Elemental","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por rodada, quem causar dano corpo a corpo em você sofre o dano fixo da Infusão. Não aplica Condutor.","category":"Elemental • Defesa","requires":["infusao-elemental"]},{"id":"rastro-elemental","section":"11. Técnicas elementais","name":"Rastro Elemental","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Depois de mover-se, gaste 3 RC para deixar 1 espaço perigoso até o próximo turno. Entrar nele causa 3 dano, uma vez por criatura.","category":"Elemental • Terreno","requires":["infusao-elemental"]},{"id":"mina-organica","section":"11. Técnicas elementais","name":"Mina Orgânica","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Gaste uma Ação e 3 RC para plantar uma mina. Quando acionada, usa sua MD, causa +3 dano fixo e Condutor básico em 1 alvo.","category":"Elemental • Armadilha","requires":["infusao-elemental"]},{"id":"propulsao-elemental","section":"11. Técnicas elementais","name":"Propulsão Elemental","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Ao ativar a Infusão, mova 1 espaço. Uma vez por rodada, ao aplicar Condutor, pode pagar 2 RC para mover 1 espaço.","category":"Elemental • Mobilidade","requires":["infusao-elemental"]},{"id":"explosao-elemental","section":"11. Técnicas elementais","name":"Explosão Elemental","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Gaste 6 RC ao acertar. Área de 1 espaço, +2 Passos; alvos secundários recebem metade dos Passos de Dano e apenas o Condutor básico.","category":"Elemental • Área","requires":["infusao-elemental"]},{"id":"feixe-concentrado","section":"11. Técnicas elementais","name":"Feixe Concentrado","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Gaste uma Ação carregando e 8 RC. Até o próximo turno, ataque em linha com +6 Passos de Dano; não combina com condensação.","category":"Elemental • Explosão","requires":["infusao-elemental"]},{"id":"armadura-elemental","section":"11. Técnicas elementais","name":"Armadura Elemental","grade":8,"cb":10,"ck":5,"cm":2,"effect":"+3 RD contra a propriedade escolhida. Ao bloquear totalmente, aplique Condutor básico ao agressor, uma vez por turno.","category":"Elemental • Defesa","requires":["infusao-elemental"]},{"id":"carcere-elemental","section":"11. Técnicas elementais","name":"Cárcere Elemental","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Depois de acertar, gaste 6 RC. O alvo testa Vigor; em falha fica preso e usa Movimento para tentar sair. Não funciona em rodadas consecutivas.","category":"Elemental • Controle","requires":["infusao-elemental"]},{"id":"onda-de-choque","section":"11. Técnicas elementais","name":"Onda de Choque","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Gaste 5 RC. Cone curto, um teste por alvo, dano com -1 Passo e Condutor básico. Uma rolagem de dano para todos.","category":"Elemental • Área","requires":["infusao-elemental"]},{"id":"tempestade-de-rc","section":"11. Técnicas elementais","name":"Tempestade de RC","grade":10,"cb":16,"ck":8,"cm":3,"effect":"Gaste 12 RC. Por 2 turnos, uma área de 2 espaços causa 3 dano no início do turno e aplica Condutor básico após teste de defesa. Uma vez por cena.","category":"Elemental • Domínio","requires":["infusao-elemental"]},{"id":"canhao-de-nucleo","section":"11. Técnicas elementais","name":"Canhão de Núcleo","grade":10,"cb":18,"ck":9,"cm":3,"effect":"Gaste 12 RC e sacrifique Movimento. Um ataque recebe +11 Passos de Dano; depois a Infusão desliga até o próximo turno.","category":"Elemental • Finalizador","requires":["infusao-elemental"]},{"id":"revestimento-total","section":"11. Técnicas elementais","name":"Revestimento Total","grade":10,"cb":14,"ck":7,"cm":2,"effect":"O Condutor pode ser aplicado por ataque corpo a corpo, defesa ou movimento, mas no máximo uma vez por turno no total.","category":"Elemental • Versatilidade","requires":["infusao-elemental"]},{"id":"dominio-elemental","section":"11. Técnicas elementais","name":"Domínio Elemental","grade":12,"cb":24,"ck":12,"cm":4,"effect":"Uma vez por sessão, gaste 20 RC. Por 3 turnos, área de 3 espaços; +4 Passos de Dano, Condutor elevado e +2 RD. Ao fim, perca 10 RC e a Infusão não ativa por 2 turnos.","category":"Elemental • Finalizador","requires":["infusao-elemental","potencia-elemental"]},{"id":"farpas-de-contencao","section":"12. Controle, sentidos e utilidade","name":"Farpas de Contenção","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+2 dados para agarrar com a Kakuja. Ao vencer, o alvo sofre -1 dado na primeira tentativa de escapar.","category":"Controle"},{"id":"constricao","section":"12. Controle, sentidos e utilidade","name":"Constrição","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Após acertar, gaste 4 RC para prender. Enquanto mantiver, aquela parte não ataca outro alvo e o inimigo sofre -2 dados para mover-se.","category":"Controle"},{"id":"gancho-predatorio","section":"12. Controle, sentidos e utilidade","name":"Gancho Predatório","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Ao acertar, gaste 2 RC para puxar 1 espaço em vez de empurrar. Alvo muito maior exige teste do Atributo Principal.","category":"Controle • Movimento"},{"id":"zona-de-membros","section":"12. Controle, sentidos e utilidade","name":"Zona de Membros","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Inimigos no alcance da Kakuja sofrem -1 dado para atravessar ou abandoná-lo sem proteção.","category":"Controle • Zona"},{"id":"prisao-de-carne","section":"12. Controle, sentidos e utilidade","name":"Prisão de Carne","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Gaste uma Ação e 8 RC para cercar um alvo. Ele testa Força ou Agilidade contra sua MD; em falha fica contido até destruir Dureza igual ao seu Grau ou escapar.","category":"Controle • Construto"},{"id":"parede-organica","section":"12. Controle, sentidos e utilidade","name":"Parede Orgânica","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Gaste uma Ação e 4 RC para criar cobertura com Dureza igual ao Grau + Vigor. Dura a cena ou até ser destruída.","category":"Utilidade • Construto"},{"id":"ponte-de-carne","section":"12. Controle, sentidos e utilidade","name":"Ponte de Carne","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Crie passagem, cabo, escada ou suporte dentro do alcance. Suporta criaturas até sua categoria de tamanho sem teste.","category":"Utilidade • Construto"},{"id":"abrigo-movel","section":"12. Controle, sentidos e utilidade","name":"Abrigo Móvel","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Aliados adjacentes podem usar sua Kakuja como cobertura e recebem +2 RD contra ataques de uma direção escolhida.","category":"Utilidade • Proteção"},{"id":"nervos-de-rc","section":"12. Controle, sentidos e utilidade","name":"Nervos de RC","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Perceba manifestações ativas em alcance Próximo mesmo sem vê-las. Revela direção aproximada, não identidade ou posição exata.","category":"Sentidos • Biológico"},{"id":"radar-predatorio","section":"12. Controle, sentidos e utilidade","name":"Radar Predatório","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Gaste uma Ação: até o próximo turno, localize concentrações de RC em alcance Curto através de cobertura comum de até 1 metro.","category":"Sentidos • RC"},{"id":"ecolocalizacao","section":"12. Controle, sentidos e utilidade","name":"Ecolocalização","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Ignore até 2 dados de penalidade por escuridão, fumaça ou visão bloqueada em alcance Próximo. Silêncio absoluto ou vácuo impedem.","category":"Sentidos"},{"id":"camuflagem-celular","section":"12. Controle, sentidos e utilidade","name":"Camuflagem Celular","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Gaste 4 RC e uma Ação. Enquanto não atacar, +3 dados de Furtividade e inimigos precisam percebê-lo para mirar. Mover rápido reduz para +1.","category":"Utilidade • Furtividade"},{"id":"mascara-mimetica","section":"12. Controle, sentidos e utilidade","name":"Máscara Mimética","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Altere voz, face ou silhueta Kakuja. +2 dados para disfarçar identidade; não copia memórias, cheiro ou técnicas.","category":"Biológico • Social"},{"id":"voz-do-monstro","section":"12. Controle, sentidos e utilidade","name":"Voz do Monstro","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Uma vez por combate, inimigos que ouçam testam Controle. Em falha, -1 dado no primeiro ataque contra você. Não afeta o mesmo alvo novamente na cena.","category":"Mental • Presença"},{"id":"rede-neural","section":"12. Controle, sentidos e utilidade","name":"Rede Neural","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Comunique mensagens simples e direção a aliados tocados por um filamento. Alcance Curto; não lê pensamentos.","category":"Utilidade • Comunicação"},{"id":"rastreador-de-rc","section":"12. Controle, sentidos e utilidade","name":"Rastreador de RC","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Depois de ferir um alvo com Kakuja, rastreie seu rastro de RC por uma cena, salvo se ele remover a matéria ou mascarar a assinatura.","category":"Sentidos • Caça"},{"id":"selo-do-kakuhou","section":"12. Controle, sentidos e utilidade","name":"Selo do Kakuhou","grade":10,"cb":16,"ck":8,"cm":3,"effect":"Após atingir diretamente uma Kagune, gaste 8 RC. O alvo testa Vigor; em falha, custos ativos de Kagune aumentam em +2 RC por 1 turno. Não acumula.","category":"Controle • Supressão"},{"id":"campo-de-caca","section":"12. Controle, sentidos e utilidade","name":"Campo de Caça","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Escolha terreno de até 2 espaços. Armadilhas e membros concedem +2 dados para detectar, impedir fuga ou atacar alguém que se mova ali; máximo uma ativação por turno.","category":"Controle • Zona"},{"id":"artilharia-alada","section":"13. Módulos Ukaku","name":"Artilharia Alada","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+1 espaço de alcance e +2 Passos de Dano no primeiro disparo do turno se você não estiver agarrado.","category":"Ukaku • Distância"},{"id":"penas-de-recuo","section":"13. Módulos Ukaku","name":"Penas de Recuo","grade":6,"cb":6,"ck":3,"cm":1,"effect":"Após disparar, mova 1 espaço uma vez por turno. Não ativa outro movimento gratuito.","category":"Ukaku • Mobilidade"},{"id":"chuva-de-cristais","section":"13. Módulos Ukaku","name":"Chuva de Cristais","grade":6,"cb":8,"ck":4,"cm":2,"effect":"Gaste 5 RC. Ataque até três alvos na mesma zona com um teste e dano -2 Passos. Um alvo recebe Condutor/efeito de ao acertar.","category":"Ukaku • Área"},{"id":"blindagem-cristalina","section":"13. Módulos Ukaku","name":"Blindagem Cristalina","grade":8,"cb":10,"ck":5,"cm":1,"effect":"A Dureza Ukaku passa de x0,5 para x0,8. Se possuir Assim como uma certa Coruka, use x1,1 em vez de somar.","category":"Ukaku • Defesa"},{"id":"mergulho-rubro","section":"13. Módulos Ukaku","name":"Mergulho Rubro","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Depois de voar 2 espaços em linha, gaste 6 RC: ataque corpo a corpo com +5 Passos de Dano; mova 1 espaço depois.","category":"Ukaku • Explosão"},{"id":"railgun-organico","section":"13. Módulos Ukaku","name":"Railgun Orgânico","grade":8,"cb":14,"ck":7,"cm":2,"effect":"Carregue com uma Ação e 8 RC. Próximo disparo: +4 acerto e +7 Passos de Dano. Não combina com condensação.","category":"Ukaku • Explosão"},{"id":"predador-dos-ceus","section":"13. Módulos Ukaku","name":"Predador dos Céus","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Enquanto não permanecer parado, +2 Esquiva. Após Esquiva bem-sucedida, próximo disparo recebe +2 acerto, uma vez por turno.","category":"Ukaku • Ritmo"},{"id":"serafim-carmesim","section":"13. Módulos Ukaku","name":"Serafim Carmesim","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Uma vez por turno, gaste 5 RC para o único ataque adicional, com metade dos Passos de Dano, sem gatilhos ou novos ataques.","category":"Ukaku • Ataque adicional"},{"id":"cidadela-de-carne","section":"14. Módulos Koukaku","name":"Cidadela de Carne","grade":6,"cb":8,"ck":4,"cm":1,"effect":"+3 RD, -1 dado de Esquiva. Conta no teto de RD da Kakuja.","category":"Koukaku • Defesa"},{"id":"arma-de-cerco","section":"14. Módulos Koukaku","name":"Arma de Cerco","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Escolha martelo, machado ou lâmina pesada: +2 Passos e -1 acerto. Trocar forma custa 2 RC.","category":"Koukaku • Ofensivo"},{"id":"escudo-de-area","section":"14. Módulos Koukaku","name":"Escudo de Área","grade":8,"cb":10,"ck":5,"cm":2,"effect":"Como Reação e 5 RC, aliados adjacentes recebem sua RD Koukaku contra um ataque em área. Você continua sendo atingido normalmente.","category":"Koukaku • Proteção"},{"id":"metal-vivo","section":"14. Módulos Koukaku","name":"Metal Vivo","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Quando atingido por golpe contundente, o agressor testa Vigor; falha causa metade dos seus Passos de Dano básicos Koukaku. Uma vez por turno por agressor.","category":"Koukaku • Retaliação"},{"id":"forma-bastiao","section":"14. Módulos Koukaku","name":"Forma Bastião","grade":8,"cb":14,"ck":7,"cm":2,"effect":"Mantenha modo ofensivo e defensivo. Bônus equivalentes usam o maior. Ativar custa 5 RC e manter custa 3 RC por turno.","category":"Koukaku • Postura"},{"id":"montanha-inamovivel","section":"14. Módulos Koukaku","name":"Montanha Inamovível","grade":10,"cb":12,"ck":6,"cm":1,"effect":"Cada turno parado concede +2 RD, máximo +6. Mover mais da metade do Deslocamento zera.","category":"Koukaku • Defesa"},{"id":"arsenal-do-carrasco","section":"14. Módulos Koukaku","name":"Arsenal do Carrasco","grade":10,"cb":16,"ck":8,"cm":2,"effect":"No início do turno: Sabre +3 acerto; Machado +5 Passos de Dano; Escudo +4 RD; Lança +2 acerto e +1 alcance. Uma forma por vez.","category":"Koukaku • Postura"},{"id":"fortaleza-de-carne","section":"14. Módulos Koukaku","name":"Fortaleza de Carne","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Uma vez por turno, gaste 5 RC para aumentar RD contra um golpe em metade do Vigor base. Se zerar o dano, recupere 2 RC.","category":"Koukaku • Defesa"},{"id":"hidra-controlada","section":"15. Módulos Rinkaku","name":"Hidra Controlada","grade":6,"cb":8,"ck":4,"cm":1,"effect":"+2 apêndices funcionais. Eles não criam ataques; +2 dados para agarrar ou defender com partes diferentes.","category":"Rinkaku • Membros"},{"id":"caudas-ofensivas","section":"15. Módulos Rinkaku","name":"Caudas Ofensivas","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Reserve apêndices para ataque: +2 Passos de Dano. Enquanto ativo, -2 RD contra o próximo golpe antes do seu turno.","category":"Rinkaku • Postura"},{"id":"regeneracao-superior","section":"15. Módulos Rinkaku","name":"Regeneração Superior","grade":6,"cb":10,"ck":5,"cm":2,"effect":"No início do turno, cure 1/6 da Vida Máxima. Use apenas a maior regeneração. Ao atingir o limiar da regra, perca 2 RC ou +1 Fome.","category":"Rinkaku • Regeneração"},{"id":"guarda-de-hidra","section":"15. Módulos Rinkaku","name":"Guarda de Hidra","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Reserve uma cauda: +2 RD ou +2 dados de Esquiva contra um ataque. A cauda não participa de ataques até seu próximo turno.","category":"Rinkaku • Defesa"},{"id":"hidra-faminta","section":"15. Módulos Rinkaku","name":"Hidra Faminta","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Ao perder uma cauda, gaste 5 RC para regenerá-la e fazer o único ataque adicional do turno com -1 acerto e metade dos Passos de Dano.","category":"Rinkaku • Regeneração"},{"id":"canibalismo-celular","section":"15. Módulos Rinkaku","name":"Canibalismo Celular","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Destrua até duas caudas. A primeira recupera 10% Vida +4 RC; a segunda 5% +2 RC. Não regeneram naturalmente por 2 turnos.","category":"Rinkaku • Sacrifício"},{"id":"centopeia","section":"15. Módulos Rinkaku","name":"Centopeia","grade":10,"cb":18,"ck":9,"cm":3,"effect":"Gaste 12 RC por 3 turnos: +4 Passos de Dano, +2 acerto e a primeira cauda destruída por turno regenera de graça. Ao fim, perca 10 RC.","category":"Rinkaku • Transformação"},{"id":"nao-consigo-morrer","section":"15. Módulos Rinkaku","name":"Não Consigo Morrer","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Uma vez por sessão, ao chegar a 0 Vida, continue consciente por 2 turnos. Se não terminar acima de 0, caia. Outros efeitos não reiniciam a duração.","category":"Rinkaku • Sobrevivência"},{"id":"predador-perfeito","section":"16. Módulos Bikaku","name":"Predador Perfeito","grade":6,"cb":8,"ck":4,"cm":1,"effect":"No início do turno escolha Ataque (+2 Passos de Dano), Defesa (+2 RD) ou Mobilidade (+2 Esquiva).","category":"Bikaku • Postura"},{"id":"cauda-de-contrapeso","section":"16. Módulos Bikaku","name":"Cauda de Contrapeso","grade":6,"cb":6,"ck":3,"cm":1,"effect":"+1 acerto em arma Kakuja corpo a corpo e +2 dados contra derrubar ou empurrar.","category":"Bikaku • Equilíbrio"},{"id":"lamina-adaptativa","section":"16. Módulos Bikaku","name":"Lâmina Adaptativa","grade":6,"cb":8,"ck":4,"cm":1,"effect":"Depois de errar um alvo, próximo ataque contra ele recebe +1 acerto e +2 Passos. Uma ativação por alvo na cena; custa 2 RC.","category":"Bikaku • Adaptação"},{"id":"guarda-de-escorpiao","section":"16. Módulos Bikaku","name":"Guarda de Escorpião","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Depois de Bloquear, próximo ataque contra o agressor recebe +2 dados de acerto. Uma vez por rodada.","category":"Bikaku • Contra-ataque"},{"id":"cauda-do-escorpiao","section":"16. Módulos Bikaku","name":"Cauda do Escorpião","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Uma vez por turno, ao acertar, gaste 5 RC: ignore metade da RD, +2 acerto ou atinja parte específica sem penalidade.","category":"Bikaku • Explosão"},{"id":"duelo-absoluto","section":"16. Módulos Bikaku","name":"Duelo Absoluto","grade":8,"cb":12,"ck":6,"cm":1,"effect":"Escolha um inimigo: +1 acerto e +1 defesa contra ele; -1 defesa contra os demais. Troque no início do turno.","category":"Bikaku • Duelo"},{"id":"mestre-de-nada","section":"16. Módulos Bikaku","name":"Mestre de Nada","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Posturas passam a +4 Passos de Dano, +4 RD ou +4 Esquiva. Por 5 RC, mantenha duas até o próximo turno, usando tetos normais.","category":"Bikaku • Postura"},{"id":"evolucao-convergente","section":"16. Módulos Bikaku","name":"Evolução Convergente","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Uma vez por sessão, 3 turnos: escolha duas adaptações por turno entre +5 Passos de Dano, +3 acerto, +5 RD, +3 Esquiva ou +1 alcance. Não repita a dupla seguida.","category":"Bikaku • Transformação"},{"id":"bombardeiro-couracado","section":"17. Convergências Quiméricas","name":"Bombardeiro Couraçado","grade":8,"cb":14,"ck":7,"cm":2,"effect":"Ukaku + Koukaku. Voando, mantenha +3 RD sem perder disparos. Ao zerar dano, mova 1 espaço, uma vez por turno.","category":"Ukaku + Koukaku"},{"id":"railgun-de-tungstenio","section":"17. Convergências Quiméricas","name":"Railgun de Tungstênio","grade":10,"cb":18,"ck":9,"cm":3,"effect":"Ukaku + Koukaku. Ação e 10 RC: o próximo disparo recebe +6 acerto, +10 Passos de Dano e ignora 2 RD. Não combina com condensação.","category":"Ukaku + Koukaku"},{"id":"fenix-centopeia","section":"17. Convergências Quiméricas","name":"Fênix Centopeia","grade":10,"cb":18,"ck":9,"cm":3,"effect":"Ukaku + Rinkaku. Ao regenerar Vida ou cauda, próximo disparo recebe +3 Passos de Dano. Uma vez por turno; perder cauda cria explosão de metade dos Passos de Dano.","category":"Ukaku + Rinkaku"},{"id":"tempestade-de-carne","section":"17. Convergências Quiméricas","name":"Tempestade de Carne","grade":12,"cb":22,"ck":11,"cm":4,"effect":"Ukaku + Rinkaku. Gaste 15 RC por 2 turnos; sofrer dano, perder cauda ou regenerar gera Carga, máximo 5; cada Carga concede +1 Passo de Dano. Somem ao fim.","category":"Ukaku + Rinkaku"},{"id":"predador-de-angulo-morto","section":"17. Convergências Quiméricas","name":"Predador de Ângulo Morto","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Ukaku + Bikaku. Ao atacar de direção diferente da anterior: +2 acerto e +2 Passos de Dano. Não acumula.","category":"Ukaku + Bikaku"},{"id":"linha-de-execucao","section":"17. Convergências Quiméricas","name":"Linha de Execução","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Ukaku + Bikaku. Mover antes de atacar gera Vetor, máximo 5. Consuma 5: receba +5 acerto, +7 Passos de Dano e ignore metade da RD.","category":"Ukaku + Bikaku"},{"id":"fortaleza-ambulante","section":"17. Convergências Quiméricas","name":"Fortaleza Ambulante","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Koukaku + Rinkaku. Mover 1 espaço não remove postura imóvel; cauda reservada concede +1 RD adicional.","category":"Koukaku + Rinkaku"},{"id":"leviata-imortal","section":"17. Convergências Quiméricas","name":"Leviatã Imortal","grade":12,"cb":22,"ck":11,"cm":4,"effect":"Koukaku + Rinkaku. 20 RC, 3 turnos: +5 RD, +3 Passos de Dano e primeira cauda destruída por turno regenera. Depois, -6 RD por 2 turnos.","category":"Koukaku + Rinkaku"},{"id":"lanca-escorpionica","section":"17. Convergências Quiméricas","name":"Lança Escorpiônica","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Koukaku + Bikaku. +1 alcance para arma Koukaku; ataques de oportunidade +2 acerto e +3 Passos de Dano.","category":"Koukaku + Bikaku"},{"id":"cavaleiro-escarlate","section":"17. Convergências Quiméricas","name":"Cavaleiro Escarlate","grade":12,"cb":22,"ck":11,"cm":4,"effect":"Koukaku + Bikaku. 3 turnos: +4 RD, +2 acerto; primeira defesa corpo a corpo total por turno gera ataque adicional com metade dos Passos de Dano.","category":"Koukaku + Bikaku"},{"id":"orochi","section":"17. Convergências Quiméricas","name":"Orochi","grade":12,"cb":22,"ck":11,"cm":4,"effect":"Rinkaku + Bikaku. 3 turnos: +2 caudas, +3 Passos de Dano, +2 defesa e +1 alcance. Primeiro erro inimigo na rodada permite ataque adicional com metade dos Passos de Dano.","category":"Rinkaku + Bikaku"},{"id":"quimera-absoluta","section":"17. Convergências Quiméricas","name":"Quimera Absoluta","grade":12,"cb":30,"ck":15,"cm":5,"effect":"Quatro tipos. Uma vez por sessão, 20 RC por 3 turnos: +3 acerto, +4 Passos de Dano, +4 RD, +2 Esquiva e +1 alcance. Depois, -20 RC e Kakuja desativa por 2 turnos.","category":"Quimera quádrupla"},{"id":"rei-das-feras","section":"18. Evoluções exclusivas de Kakuja","name":"Rei das Feras","grade":8,"cb":16,"ck":8,"cm":3,"effect":"Por 8 RC e 3 turnos: +2 Passos corpo a corpo, +2 dados de acerto e +1 espaço de movimento. Ao fim, -2 dados de defesa por 1 turno.","category":"Evolução • Predador"},{"id":"bastiao-devorador","section":"18. Evoluções exclusivas de Kakuja","name":"Bastião Devorador","grade":8,"cb":16,"ck":8,"cm":3,"effect":"Por 8 RC e 3 turnos: +4 RD; sempre que zerar dano, ganhe 1 Carga, máximo 3; consuma no ataque como Passos de Dano.","category":"Evolução • Fortaleza"},{"id":"enxame-faminto","section":"18. Evoluções exclusivas de Kakuja","name":"Enxame Faminto","grade":8,"cb":16,"ck":8,"cm":3,"effect":"Por 8 RC e 2 turnos: ataques podem atingir até 3 alvos na zona com -2 Passos; uma única rolagem e um único Condutor.","category":"Evolução • Enxame"},{"id":"muda-adaptativa","section":"18. Evoluções exclusivas de Kakuja","name":"Muda Adaptativa","grade":8,"cb":16,"ck":8,"cm":3,"effect":"Uma vez por cena, ao sofrer dano, troque até metade da CM sem Ação e receba +2 RD contra a fonte até o próximo turno.","category":"Evolução • Metamorfose"},{"id":"tirano-de-guerra","section":"18. Evoluções exclusivas de Kakuja","name":"Tirano de Guerra","grade":10,"cb":20,"ck":10,"cm":4,"effect":"Por 10 RC e 3 turnos: +6 Passos de Dano e alcance +1. Não pode usar ataque adicional enquanto durar.","category":"Evolução • Predador"},{"id":"fortaleza-que-anda","section":"18. Evoluções exclusivas de Kakuja","name":"Fortaleza que Anda","grade":10,"cb":20,"ck":10,"cm":4,"effect":"Por 10 RC e 3 turnos: +6 RD, imunidade a deslocamento por semelhantes e pode proteger aliado adjacente. -2 Esquiva.","category":"Evolução • Fortaleza"},{"id":"devorador-de-kakuhous","section":"18. Evoluções exclusivas de Kakuja","name":"Devorador de Kakuhous","grade":10,"cb":20,"ck":10,"cm":4,"effect":"Por 10 RC e 3 turnos: ao causar dano a Kagune/Kakuja, recupere 2 RC, máximo 4/turno; alvo sofre -2 Dureza até o fim da cena, máximo -6.","category":"Evolução • Dreno"},{"id":"arsenal-de-cem-formas","section":"18. Evoluções exclusivas de Kakuja","name":"Arsenal de Cem Formas","grade":10,"cb":20,"ck":10,"cm":4,"effect":"Por 10 RC e 3 turnos: no início do turno escolha dois entre +3 acerto, +4 Passos de Dano, +4 RD, +2 Esquiva e +1 alcance. Não repita a dupla seguida.","category":"Evolução • Metamorfose"},{"id":"impacto-de-exterminio","section":"18. Evoluções exclusivas de Kakuja","name":"Impacto de Extermínio","grade":10,"cb":22,"ck":11,"cm":4,"effect":"Uma vez por sessão: 15 RC, +13 Passos de Dano e ignora metade da RD. Depois, RD Kakuja = 0 e Movimento reduzido em 1 por 3 turnos.","category":"Finalizador • Corpo a corpo"},{"id":"canhao-do-kakuhou","section":"18. Evoluções exclusivas de Kakuja","name":"Canhão do Kakuhou","grade":10,"cb":22,"ck":11,"cm":4,"effect":"Uma vez por sessão: carregue uma Ação, 15 RC; linha longa, +14 Passos de Dano. Depois, não use ataque à distância por 2 turnos.","category":"Finalizador • Distância"},{"id":"avatar-da-fome","section":"18. Evoluções de Grau 12 e 14","name":"Avatar da Fome","grade":12,"cb":26,"ck":13,"cm":5,"effect":"Por 15 RC e 3 turnos: +4 Passos, +4 acerto e cada inimigo real derrotado recupera 2 RC, máximo 4/turno. Ao fim, +2 Fome.","category":"Evolução • Predador"},{"id":"leviata-absoluto","section":"18. Evoluções de Grau 12 e 14","name":"Leviatã Absoluto","grade":12,"cb":26,"ck":13,"cm":5,"effect":"Por 15 RC e 3 turnos: +8 RD, regeneração +25% e não pode ser derrubado. Ao fim, -6 RD por 2 turnos.","category":"Evolução • Fortaleza"},{"id":"cerebro-de-colmeia","section":"18. Evoluções de Grau 12 e 14","name":"Cérebro de Colmeia","grade":12,"cb":26,"ck":13,"cm":5,"effect":"Por 15 RC e 3 turnos: até 5 fragmentos ocupam zonas diferentes; você percebe por eles e um ataque por turno pode partir de qualquer fragmento. Só uma Ação total.","category":"Evolução • Enxame"},{"id":"predador-absoluto","section":"18. Evoluções de Grau 12 e 14","name":"Predador Absoluto","grade":12,"cb":26,"ck":13,"cm":5,"effect":"Por 15 RC e 3 turnos: +3 acerto, +3 defesa e, uma vez por turno, escolha +4 Passos de Dano, ignorar 4 RD ou mover 1 após atacar.","category":"Evolução • Adaptação"},{"id":"ruina-de-cem-membros","section":"18. Evoluções de Grau 12 e 14","name":"Ruína de Cem Membros","grade":12,"cb":30,"ck":15,"cm":5,"effect":"Uma vez por sessão: 20 RC; ataque todos os inimigos em 2 espaços com +16 Passos de Dano. Um teste e um dano. Depois, Kakuja desativa por 2 turnos.","category":"Finalizador • Área"},{"id":"golpe-que-rasga-o-ceu","section":"18. Evoluções de Grau 12 e 14","name":"Golpe que Rasga o Céu","grade":12,"cb":30,"ck":15,"cm":5,"effect":"Uma vez por sessão: 20 RC; +18 Passos de Dano, +4 acerto e ignora metade da RD. Depois, RD = 0 por 5 turnos.","category":"Finalizador • Corpo a corpo"},{"id":"calamidade-ambulante","section":"18. Evoluções de Grau 12 e 14","name":"Calamidade Ambulante","grade":14,"cb":30,"ck":15,"cm":6,"effect":"Por 20 RC e 3 turnos: +12 Passos de Dano, +5 RD, +2 acerto e +1 alcance. Ao fim, perca 20 RC e receba +2 Fome.","category":"Evolução • Grau 14"},{"id":"forma-dragao","section":"18. Evoluções de Grau 12 e 14","name":"Forma Dragão","grade":14,"cb":30,"ck":15,"cm":6,"effect":"Por 20 RC e 3 turnos: voo, tamanho Colosso, área de presença 2 espaços e escolha a cada turno Sopro (+4 Passos em cone) ou Investida (+4 Passos em linha).","category":"Evolução • Grau 14"},{"id":"o-monstro-nao-escolheu","section":"18. Evoluções de Grau 12 e 14","name":"O Monstro Não Escolheu","grade":14,"cb":30,"ck":15,"cm":6,"effect":"Por 20 RC e 3 turnos, escolha dois por turno: +4 Passos de Dano, +3 Esquiva, +3 acerto, +5 RD, +1 alcance ou primeira cura +25%. Não repita a dupla. Ao fim, +2 Fome.","category":"Evolução • Grau 14"},{"id":"fim-da-cacada","section":"18. Evoluções de Grau 12 e 14","name":"Fim da Caçada","grade":14,"cb":30,"ck":15,"cm":6,"effect":"Uma vez por sessão: 25 RC; ataque único no teto +28 Passos da Kakuja, +5 acerto e ignora metade da RD. Depois, RC vai a 0 e a Kakuja encerra.","category":"Finalizador • Grau 14"},{"id":"membro-de-reserva","section":"19. Ofensivos Extras · Geradores","name":"Membro de Reserva","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Depois que um ataque normal da Kakuja errar, gaste 5 RC. Faça o único ataque adicional contra o mesmo alvo, com metade dos Passos de Dano e +1 Acerto. O alvo ainda precisa estar ao alcance.","category":"Ofensivo • Ataque adicional • Correção"},{"id":"troca-de-presa","section":"19. Ofensivos Extras · Geradores","name":"Troca de Presa","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Ao reduzir um inimigo relevante a 0 Vida com um ataque normal da Kakuja, gaste 4 RC. Faça o único ataque adicional contra outro alvo ao alcance, com metade dos Passos de Dano e -1 Acerto. Figurantes criados para alimentar o gatilho não contam.","category":"Ofensivo • Ataque adicional • Execução"},{"id":"perseguicao-serrilhada","section":"19. Ofensivos Extras · Geradores","name":"Perseguição Serrilhada","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Quando um alvo ferido por sua Kakuja desde o último turno tentar sair voluntariamente do seu alcance, use a Reação e 4 RC. Antes do movimento, faça o único ataque adicional com metade dos Passos de Dano e -1 Acerto. Substitui qualquer ataque de oportunidade.","category":"Ofensivo • Reação • Perseguição"},{"id":"interceptacao-carniceira","section":"19. Ofensivos Extras · Geradores","name":"Interceptação Carniceira","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Quando um inimigo dentro do alcance declarar um ataque contra um aliado, use a Reação e 6 RC. Resolva antes o único ataque adicional contra ele, com metade dos Passos de Dano e -1 Acerto. O ataque inimigo só é cancelado se ele ficar incapaz de agir.","category":"Ofensivo • Reação • Proteção"},{"id":"abertura-compartilhada","section":"19. Ofensivos Extras · Geradores","name":"Abertura Compartilhada","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Depois que um aliado causar dano a um inimigo relevante dentro do seu alcance, use a Reação e 6 RC. Faça o único ataque adicional contra o mesmo alvo, com metade dos Passos de Dano e -1 Acerto.","category":"Ofensivo • Reação • Cooperação"},{"id":"investida-bifurcada","section":"19. Ofensivos Extras · Geradores","name":"Investida Bifurcada","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Depois de mover pelo menos 2 espaços e concluir um ataque corpo a corpo normal, gaste 4 RC. Faça o único ataque adicional contra outro alvo ao alcance, com metade dos Passos de Dano e -1 Acerto. Nunca pode repetir o primeiro alvo.","category":"Ofensivo • Ataque adicional • Mobilidade"},{"id":"ruptura-da-guarda","section":"19. Ofensivos Extras · Geradores","name":"Ruptura da Guarda","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Após um ataque normal da Kakuja reduzir a RD do alvo por um efeito seu, gaste 6 RC. Faça o único ataque adicional contra ele com metade dos Passos de Dano, ignorando 2 RD. A redução do primeiro golpe não é aplicada novamente.","category":"Ofensivo • Ataque adicional • Penetração"},{"id":"resposta-ao-sangue","section":"19. Ofensivos Extras · Geradores","name":"Resposta ao Sangue","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Ao sofrer de um único ataque corpo a corpo dano após RD igual ou superior ao seu Grau, use a Reação e 5 RC. Ataque o agressor com metade dos Passos de Dano e -1 Acerto. O dano recebido não é reduzido.","category":"Ofensivo • Reação • Retaliação"},{"id":"ultima-mordida","section":"19. Ofensivos Extras · Geradores","name":"Última Mordida","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Uma vez por cena, quando a Dureza da Kakuja chegar a 0, use a Reação e 5 RC antes de retrair. Faça o único ataque adicional contra a fonte do último dano, se estiver ao alcance, com metade dos Passos de Dano.","category":"Ofensivo • Reação • Colapso"},{"id":"ruptura-em-duas-etapas","section":"19. Ofensivos Extras · Geradores","name":"Ruptura em Duas Etapas","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Depois que um ataque normal acertar, gaste 7 RC. Faça o único ataque adicional contra o mesmo alvo com metade dos Passos de Dano, +1 Acerto e ignorando 2 RD. Sua RD de Kakuja cai em 3 até o próximo turno. Não abre após Área, Condensação ou Finalizador.","category":"Ofensivo • Ataque adicional • Explosão"},{"id":"sinapse-economica","section":"20. Ofensivos Extras · Alteradores","name":"Sinapse Econômica","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Uma vez por turno, reduza em 1 RC o custo do ataque adicional, mínimo 4 RC. Não reduz custos anexos, como movimento, elemento ou ativação de postura.","category":"Ofensivo • Eficiência • Alterador"},{"id":"mira-do-segundo-golpe","section":"20. Ofensivos Extras · Alteradores","name":"Mira do Segundo Golpe","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Antes do ataque normal que pode abrir a janela, aceite -1 Acerto. Se um ataque adicional for gerado por ele, esse ataque recebe +2 Acerto. Se a janela não abrir, a penalidade foi perdida. O bônus da Kakuja continua limitado pelo teto normal.","category":"Ofensivo • Precisão • Alterador"},{"id":"massa-reservada","section":"20. Ofensivos Extras · Alteradores","name":"Massa Reservada","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Antes do ataque normal, retire 1 Passo de Dano. Se ele gerar um ataque adicional no mesmo turno, acrescente esse Passo depois de calcular a metade. Transfere dano entre golpes; não cria Passo novo.","category":"Ofensivo • Transferência • Alterador"},{"id":"impulso-perfurante","section":"20. Ofensivos Extras · Alteradores","name":"Impulso Perfurante","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Antes do ataque normal, retire 2 Passos de Dano. Se ele gerar um ataque adicional, esse ataque ignora 4 RD. Caso a janela não abra, os Passos continuam perdidos.","category":"Ofensivo • Penetração • Alterador"},{"id":"vetor-de-arraste","section":"20. Ofensivos Extras · Alteradores","name":"Vetor de Arraste","grade":8,"cb":8,"ck":4,"cm":1,"effect":"Antes de rolar o ataque adicional, retire 1 Passo de Dano. Se causar dano, empurre ou puxe o alvo 1 espaço. Alvos maiores testam Vigor contra sua MD. Isso é efeito próprio do módulo.","category":"Ofensivo • Controle leve • Alterador"},{"id":"sobrecarga-sinaptica","section":"20. Ofensivos Extras · Alteradores","name":"Sobrecarga Sináptica","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Uma vez por cena, ao gerar um ataque adicional, pague +5 RC. Ele mantém metade dos Passos de Dano, recebe +2 Acerto e ignora 2 RD. Depois, sua RD de Kakuja vira 0 e você perde a Reação até o próximo turno. Não combina com Ruptura em Duas Etapas.","category":"Ofensivo • Ápice • Alterador"},{"id":"dupla-salva","section":"21. Rotas Ofensivas por Kakuhou","name":"Dupla Salva","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Depois de um ataque normal à distância, gaste 5 RC. Faça o único ataque adicional com metade dos Passos de Dano. Contra outro alvo adjacente ao primeiro, não há penalidade; contra o mesmo alvo, sofra -1 Acerto.","category":"Ukaku • Ataque adicional • Distância","requiresFamilies":["Ukaku"]},{"id":"disparo-de-recuo","section":"21. Rotas Ofensivas por Kakuhou","name":"Disparo de Recuo","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Quando um inimigo terminar o movimento adjacente, use a Reação e 5 RC. Faça o único ataque adicional à distância contra ele com metade dos Passos de Dano e -1 Acerto; depois mova 1 espaço sem provocar oportunidade. Falha se estiver agarrado ou imobilizado.","category":"Ukaku • Reação • Mobilidade","requiresFamilies":["Ukaku"]},{"id":"contrapeso-ruptor","section":"21. Rotas Ofensivas por Kakuhou","name":"Contrapeso Ruptor","grade":8,"cb":12,"ck":6,"cm":2,"effect":"Quando um ataque normal Koukaku causar 0 dano por Bloqueio ou RD, gaste 6 RC. Repita contra o mesmo alvo com metade dos Passos de Dano, +1 Acerto e ignorando 2 RD. Sua RD cai em 2 até o próximo turno.","category":"Koukaku • Ataque adicional • Cerco","requiresFamilies":["Koukaku"]},{"id":"bastiao-agressivo","section":"21. Rotas Ofensivas por Kakuhou","name":"Bastião Agressivo","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Depois de sofrer dano corpo a corpo enquanto Bloqueia, use a Reação e 5 RC. Faça o único ataque adicional contra o agressor com metade dos Passos de Dano. Depois, bônus de RD vindos de Posturas Koukaku ficam inativos até o próximo turno.","category":"Koukaku • Reação • Contra-ataque","requiresFamilies":["Koukaku"]},{"id":"cauda-de-reserva","section":"21. Rotas Ofensivas por Kakuhou","name":"Cauda de Reserva","grade":8,"cb":10,"ck":5,"cm":1,"effect":"No início do turno, reserve uma cauda funcional; ela não defende, agarra ou controla. Depois de um ataque normal, gaste 4 RC para o único ataque adicional com metade dos Passos de Dano e -1 Acerto. Sua RD cai em 2 até o próximo turno.","category":"Rinkaku • Ataque adicional • Postura","requiresFamilies":["Rinkaku"]},{"id":"autotomia-ofensiva","section":"21. Rotas Ofensivas por Kakuhou","name":"Autotomia Ofensiva","grade":10,"cb":14,"ck":7,"cm":2,"effect":"Depois de um ataque normal, destrua uma cauda funcional e gaste 3 RC. Faça o único ataque adicional com metade dos Passos de Dano e +1 Acerto. A cauda não pode retornar por 2 turnos, nem por regeneração especial.","category":"Rinkaku • Ataque adicional • Sacrifício","requiresFamilies":["Rinkaku"]},{"id":"passo-do-escorpiao","section":"21. Rotas Ofensivas por Kakuhou","name":"Passo do Escorpião","grade":8,"cb":10,"ck":5,"cm":1,"effect":"Quando um ataque corpo a corpo errar você, use a Reação e 4 RC. Mova até 1 espaço e ataque apenas o agressor com metade dos Passos de Dano e -1 Acerto. O movimento não provoca oportunidade.","category":"Bikaku • Reação • Contra-ataque","requiresFamilies":["Bikaku"]},{"id":"reversao-perfeita","section":"21. Rotas Ofensivas por Kakuhou","name":"Reversão Perfeita","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Exige Duelo Absoluto. Quando o alvo marcado errar você, use a Reação e 5 RC. Faça o único ataque adicional com metade dos Passos de Dano e +1 Acerto. Até o próximo turno, perca o bônus defensivo contra ele e aumente em 1 a penalidade contra os demais.","category":"Bikaku • Reação • Duelo","requiresFamilies":["Bikaku"],"requires":["duelo-absoluto"]},{"id":"alternancia-quimerica","section":"22. Convergências Ofensivas","name":"Alternância Quimérica","grade":10,"cb":16,"ck":8,"cm":2,"effect":"Exige dois tipos reais de Kakuhou. Depois de atacar com a forma de um tipo, gaste 6 RC. Faça o único ataque adicional com a forma e o alcance do outro, usando metade dos Passos de Dano. Contra o mesmo alvo, sofra -1 Acerto. Efeitos exclusivos da primeira forma não são copiados.","category":"Quimera • Ataque adicional • Convergência","minFamilies":2},{"id":"pinca-assimetrica","section":"22. Convergências Ofensivas","name":"Pinça Assimétrica","grade":10,"cb":18,"ck":9,"cm":3,"effect":"Exige dois tipos e que o alvo esteja ao alcance de ambas as formas. Depois do primeiro acerto, gaste 6 RC. O único ataque adicional usa metade dos Passos de Dano, recebe +1 Acerto e ignora até 2 dados de bônus defensivo vindos de cobertura, escudo ou direção.","category":"Quimera • Ataque adicional • Pressão","minFamilies":2},{"id":"cacada-paralela","section":"22. Convergências Ofensivas","name":"Caçada Paralela","grade":12,"cb":20,"ck":10,"cm":3,"effect":"Exige dois tipos. Depois de ferir um alvo com a primeira forma, gaste 6 RC. Faça o único ataque adicional contra uma criatura diferente no alcance da segunda forma, com metade dos Passos de Dano e +1 Acerto; depois mova 1 espaço. Nunca pode repetir o primeiro alvo.","category":"Quimera • Ataque adicional • Dois alvos","minFamilies":2},{"id":"motor-de-carnificina","section":"22. Convergências Ofensivas","name":"Motor de Carnificina","grade":12,"cb":22,"ck":11,"cm":4,"effect":"Ative por 5 RC durante 3 turnos. O primeiro ataque adicional gerado em cada turno custa 2 RC a menos, mínimo 3, e recebe +1 Acerto; após cada uso, sua RD cai em 2 até o próximo turno. Não cria ataques sozinho e não funciona com Finalizador ou Sobrecarga Sináptica.","category":"Ofensivo • Transformação • Sustentação"}]`),L={6:{cm:16,passiveSteps:3,burstSteps:6,rd:6},8:{cm:18,passiveSteps:4,burstSteps:8,rd:8},10:{cm:20,passiveSteps:5,burstSteps:10,rd:10},12:{cm:22,passiveSteps:6,burstSteps:12,rd:12},14:{cm:24,passiveSteps:8,burstSteps:14,rd:14}},R=[{id:`fome-anormal`,name:`Fome Anormal`,credit:2,effect:`Cada ativação de Kakuja concede +1 Fome além de qualquer outra fonte.`},{id:`mente-rachada`,name:`Mente Rachada`,credit:2,effect:`+1 MD em todos os testes de Controle da Kakuja. Completa ainda testa esta Instabilidade uma vez por turno.`},{id:`nucleo-exposto`,name:`Núcleo Exposto`,credit:2,effect:`Ataques ao Kakuhou sofrem apenas -1 dado, e não -2.`},{id:`hemorragia-rc`,name:`Hemorragia de RC`,credit:2,effect:`Na primeira vez que sofrer dano em cada turno, perca 1 RC.`},{id:`carapaca-fragil`,name:`Carapaça Frágil`,credit:2,effect:`Dureza total da Kakuja é reduzida em 25%, arredondando para baixo.`},{id:`corpo-pesado`,name:`Corpo Pesado`,credit:1,effect:`Deslocamento Base não recebe Deslocamento Superior e Esquivas sofrem -1 dado.`},{id:`frenesi-entrada`,name:`Frenesi de Entrada`,credit:1,effect:`No primeiro turno após ativar, deve atacar uma ameaça percebida e não pode usar ação puramente defensiva.`},{id:`rigidez-anatomica`,name:`Rigidez Anatômica`,credit:1,effect:`Não pode trocar Perfis durante a cena, mesmo com Metamorfose; apenas módulos reativos temporários funcionam.`},{id:`dor-crescimento`,name:`Dor de Crescimento`,credit:1,effect:`Ativar causa dano igual ao Grau, ignorando RD. Não ativa efeitos de sofrer dano.`},{id:`ponto-cego`,name:`Ponto Cego`,credit:1,effect:`Escolha uma direção anatômica. Ataques vindos dela recebem +1 dado de acerto até você reposicionar-se.`},{id:`instinto-territorial`,name:`Instinto Territorial`,credit:1,effect:`Depois de escolher um inimigo como presa, trocar de alvo antes de derrubá-lo exige Controle MD 3.`},{id:`rejeicao-elemental`,name:`Rejeição Elemental`,credit:1,effect:`Cada turno mantendo Infusão Elemental custa +1 RC adicional.`}],z=[{id:`fogo`,name:`Fogo / Calor`,basic:`O alvo sofre +3 dano no início do próximo turno; não acumula.`,elevated:`O dano passa a +5 ou o fogo ocupa 1 espaço até o próximo turno.`},{id:`gelo`,name:`Gelo / Criogenia`,basic:`Reduza o próximo deslocamento do alvo em 1 espaço.`,elevated:`Além disso, -1 dado na primeira defesa física antes do próximo turno.`},{id:`eletricidade`,name:`Eletricidade`,basic:`O alvo não pode fazer ataque de oportunidade até o próximo turno.`,elevated:`Teste de Vigor; em falha, perde a Reação até o próximo turno.`},{id:`acido`,name:`Ácido / Corrosão`,basic:`Reduza a RD do alvo em 2 contra o próximo ataque recebido.`,elevated:`A redução passa a 4; não acumula com outra corrosão.`},{id:`veneno`,name:`Veneno`,basic:`Dano equivalente a 0 Passos no início dos próximos 2 turnos; novo acerto reinicia.`,elevated:`Dano equivalente a 1 Passo por 2 turnos ou -1 dado de Vigor enquanto durar.`},{id:`anestesico`,name:`Anestésico`,basic:`O próximo ataque do alvo sofre -1 Passo de Dano.`,elevated:`Teste de Vigor; em falha, -2 Passos de Dano no próximo ataque.`},{id:`resina`,name:`Resina / Adesivo`,basic:`O alvo perde 1 espaço do próximo movimento.`,elevated:`Segundo acerto antes do fim do turno exige Vigor; falha imobiliza até gastar Movimento.`},{id:`fumaca`,name:`Fumaça / Cinza`,basic:`O alvo sofre -1 dado para atacar além de Toque até o próximo turno.`,elevated:`Crie ocultação em 1 espaço até seu próximo turno.`},{id:`nevoa`,name:`Névoa`,basic:`Você recebe +1 dado na próxima Esquiva contra o alvo.`,elevated:`Aliado adjacente também pode receber o bônus.`},{id:`pressao`,name:`Pressão / Vento`,basic:`Empurre o alvo 1 espaço se ele falhar em Vigor.`,elevated:`Empurre 2 ou derrube; criaturas maiores recebem +2 dados.`},{id:`vibracao`,name:`Vibração / Som`,basic:`+2 dados contra objetos, barreiras ou couraças rígidas.`,elevated:`Ignore 2 RD de estruturas e revele alvos ocultos atingidos.`},{id:`cristal`,name:`Cristal`,basic:`+2 Passos de Dano em ataque à distância.`,elevated:`Em crítico, estilhaços atingem um segundo alvo adjacente com metade dos Passos de Dano.`},{id:`metal`,name:`Metal / Densidade`,basic:`+1 RD até seu próximo turno, mas -1 dado de Esquiva.`,elevated:`+2 RD no lugar; a penalidade permanece.`},{id:`fibra`,name:`Fibra / Fios`,basic:`+2 dados para agarrar ou impedir fuga com a Kakuja.`,elevated:`Ao vencer, puxe 1 espaço ou imponha -2 dados para sair.`},{id:`luz`,name:`Luz / Flash`,basic:`O alvo sofre -1 dado na próxima defesa baseada em visão.`,elevated:`Teste de Percepção; em falha, -2 dados na próxima ação visual.`},{id:`sombra`,name:`Sombra / Tinta`,basic:`O alvo sofre -1 dado de Percepção contra você até o próximo turno.`,elevated:`Você pode ocultar sua posição ao mover 1 espaço depois do acerto.`},{id:`magnetismo`,name:`Magnetismo`,basic:`+2 dados para Desarmar objeto metálico ou puxá-lo.`,elevated:`Ao vencer teste resistido, mova objeto ou alvo metálico 1 espaço.`},{id:`sifao`,name:`Sifão de RC`,basic:`Grau 10+. Em falha de Vigor, o alvo perde 1 RC; você não recupera.`,elevated:`O alvo perde 2 RC e você recupera 1; uma vez por turno.`}],B=[{id:`dado-condicional`,label:`+1 Passo condicional`,cb:4,cm:1,rule:`Condição clara: mover, bloquear, alvo ferido ou mesma presa.`},{id:`dados-passivos`,label:`+2 Passos passivos`,cb:6,cm:1,rule:`Conta no teto passivo.`},{id:`acerto`,label:`+1 Modificador de Acerto`,cb:10,cm:1,rule:`Máximo +2 vindo da Kakuja.`},{id:`passo-passivo`,label:`+1 Passo passivo`,cb:4,cm:1,rule:`Use a progressão de Potência e os mesmos requisitos de Grau.`},{id:`passos-ataque-2`,label:`+2 Passos por ataque`,cb:8,cm:1,rule:`Exige 3 a 5 RC ou condição relevante.`},{id:`passos-ataque-4`,label:`+4 Passos por ataque`,cb:12,cm:2,rule:`Exige 8 RC e consequência no turno seguinte.`},{id:`rd`,label:`+2 RD`,cb:6,cm:1,rule:`Conta no teto de RD.`},{id:`reduzir-grau`,label:`Reduzir dano em metade do Grau`,cb:6,cm:1,rule:`Reação ou uma vez por rodada; 2 a 3 RC.`},{id:`dividir-dano`,label:`Dividir dano restante por 2`,cb:12,cm:2,rule:`Depois da RD; 6 RC; uma vez por rodada.`},{id:`alcance`,label:`+1 espaço de alcance ou movimento`,cb:6,cm:1,rule:`Não cria ataque nem atravessa barreira.`},{id:`ignorar-rd-2`,label:`Ignorar 2 RD`,cb:8,cm:1,rule:`4 RC, uma vez por turno.`},{id:`ignorar-meia-rd`,label:`Ignorar metade da RD`,cb:12,cm:2,rule:`7 RC, Grau 8+, uma vez por turno.`},{id:`ataque-adicional`,label:`Ataque adicional com metade dos Passos`,cb:12,cm:2,rule:`5 RC, Grau 8+, máximo universal de um.`},{id:`segundo-alvo`,label:`Segundo alvo com metade dos Passos`,cb:8,cm:1,rule:`Um teste; -2 Passos no dano compartilhado.`},{id:`condicao-leve`,label:`Condição leve`,cb:6,cm:1,rule:`Teste ou gatilho; -1 dado, puxar, empurrar ou reduzir movimento.`},{id:`condicao-forte`,label:`Condição forte`,cb:12,cm:2,rule:`Teste, 5 a 8 RC e imunidade na rodada seguinte.`},{id:`cura-fixa`,label:`Cura fixa 2 a 4`,cb:8,cm:1,rule:`No início do turno e com limiar de RC/Fome.`},{id:`cura-percentual`,label:`Cura percentual ou prevenção de morte`,cb:16,cm:3,rule:`Grau 10+, uso por sessão e custo alto.`}],oe=[{id:`sempre-ativo`,label:`Sempre ativo e sem condição`,cb:4,cm:0,rule:`Use quando a referência normalmente seria limitada.`},{id:`reacao`,label:`Reação`,cb:2,cm:0,rule:`Além do custo normal do efeito.`},{id:`area-1`,label:`Área de 1 espaço`,cb:4,cm:1,rule:`+1 CM e uma única rolagem.`},{id:`area-2`,label:`Área de 2 ou mais`,cb:8,cm:2,rule:`+2 CM e Grau 8+.`},{id:`sem-teste`,label:`Sem teste para condição`,cb:6,cm:0,rule:`Nunca permitido para condição forte recorrente.`},{id:`custo-rc`,label:`Custo 5 RC ou maior`,cb:-2,cm:0,rule:`Redução máxima -4 por custos e riscos.`},{id:`cena`,label:`Uma vez por cena`,cb:-2,cm:0,rule:`Não reduz abaixo de CB 4.`},{id:`sessao`,label:`Uma vez por sessão`,cb:-4,cm:0,rule:`Exige consequência real e não reduz abaixo de CB 8.`},{id:`sacrificio`,label:`Sacrifício de RD, membro ou ataque`,cb:-2,cm:0,rule:`O recurso sacrificado precisa ter valor na build.`},{id:`fome`,label:`+1 Fome após uso`,cb:-2,cm:0,rule:`Máximo -2; não combina com defeito que já torna a Fome inevitável.`}],se=[{title:`Base de dano`,text:`A Kakuja começa com os mesmos Passos de Dano atuais da Kagune. Depois, módulos do Perfil ativo e Vantagens alteram o cálculo próprio da Kakuja; Dureza, reserva, CM e técnicas continuam separados.`},{title:`Ataques adicionais`,text:`No máximo um por turno; metade dos Passos de Dano, mínimo 0. Não critica, não ativa efeitos ao acertar, não recupera RC, não vira área e não gera outro ataque.`},{title:`Janela ofensiva`,text:`Todos os geradores de ataque adicional disputam a mesma janela entre o início de um turno e o início do próximo. Comprar vários geradores oferece opções, nunca uma cadeia de golpes.`},{title:`Perfis e CM`,text:`Módulos comprados formam o repertório permanente. Cada Perfil possui CM igual ao Grau + 10; trocar durante a cena exige uma mutação própria.`},{title:`Condições for
